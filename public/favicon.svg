<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <clipPath id="circleClip">
      <circle cx="100" cy="100" r="92" />
    </clipPath>
  </defs>

  <!-- Outer Green Circle Frame -->
  <circle cx="100" cy="100" r="92" fill="#ffffff" stroke="#2db34a" stroke-width="9" />

  <!-- Inner Clipped Area -->
  <g clip-path="url(#circleClip)">
    <!-- Bottom Green Curved Field -->
    <path d="M -10,132 C 40,162 160,162 210,128 L 210,210 L -10,210 Z" fill="#2db34a" />

    <!-- Hand & Soil Contour Group -->
    <!-- White separation stroke layer -->
    <path d="M 15,118 
             C 32,102 55,90 82,92 
             C 100,94 115,101 130,105 
             C 142,108 156,108 168,96 
             C 176,88 184,92 185,100 
             C 186,108 172,128 148,145 
             C 126,160 92,152 68,141 
             C 45,130 25,136 15,142 Z" 
          fill="none" stroke="#ffffff" stroke-width="8" stroke-linejoin="round" stroke-linecap="round" />

    <!-- Soil Mound -->
    <path d="M 90,96 C 108,86 138,91 152,103 C 138,112 110,108 90,96 Z" fill="#8d562e" />

    <!-- Hand Body -->
    <path d="M 15,118 
             C 32,102 55,90 82,92 
             C 100,94 115,101 130,105 
             C 142,108 156,108 168,96 
             C 176,88 184,92 185,100 
             C 186,108 172,128 148,145 
             C 126,160 92,152 68,141 
             C 45,130 25,136 15,142 Z" 
          fill="#8d562e" />

    <!-- Inner Hand Contour / Thumb Line -->
    <path d="M 72,112 C 92,108 122,118 136,118" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" fill="none" />

    <!-- Green Plant Sprout (3 Leaves) -->
    <!-- Left Leaf -->
    <path d="M 118,88 C 96,80 84,54 88,52 C 102,55 112,70 118,88 Z" fill="#2db34a" />
    <path d="M 94,57 C 104,64 112,74 118,88" stroke="#ffffff" stroke-width="1.8" fill="none" stroke-linecap="round" />

    <!-- Center Leaf (Tallest) -->
    <path d="M 118,88 C 108,62 112,36 122,34 C 129,48 127,70 118,88 Z" fill="#2db34a" />
    <path d="M 120,40 C 118,56 119,72 118,88" stroke="#ffffff" stroke-width="1.8" fill="none" stroke-linecap="round" />

    <!-- Right Leaf -->
    <path d="M 118,88 C 132,74 158,56 166,63 C 152,76 134,83 118,88 Z" fill="#2db34a" />
    <path d="M 158,66 C 146,73 132,81 118,88" stroke="#ffffff" stroke-width="1.8" fill="none" stroke-linecap="round" />
  </g>
</svg>
